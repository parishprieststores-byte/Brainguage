body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}

p{margin:.4em 0}.mu{color:var(--mu)}small{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:12px 18px;font-weight:600;width:100%}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;margin:10px 0}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.vis{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 14px;font-size:1.5rem;font-weight:700;letter-spacing:.02em}
.vis svg,.opt svg{border:1px solid var(--bd);border-radius:10px;padding:4px;background:var(--bg);color:var(--tx)}
.qm{font-size:2rem;color:var(--ac)}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:12px}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.pat .opts{grid-template-columns:1fr 1fr}.pat .opt{display:flex;justify-content:center}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.dots button{width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);background:var(--card);font-size:.75rem;padding:0}
.dots .a{background:var(--ac);color:var(--on);border-color:var(--ac)}.dots .f{border:2px solid var(--hi)}.dots .c{outline:2px solid var(--tx);outline-offset:1px}
.score{text-align:center}.score .n{font-size:4.5rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.dm{display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center;margin:8px 0;font-size:.95rem}
.dm .bar{margin:0;height:10px}.dm .bar i{background:var(--hi)}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
.rv{border-top:1px solid var(--bd);padding:10px 0}.ok{color:var(--ok)}.no{color:var(--bad)}
.rv .vis{font-size:1rem}.rv svg{width:44px;height:44px}

const $=s=>document.querySelector(s),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,
sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a},pk=a=>a[R(0,a.length-1)];

AGES=[{n:"6–9",lv:[1,1,2,2,3],m:.55,t:1500},{n:"10–13",lv:[1,2,2,3,4],m:.5,t:1500},{n:"14–17",lv:[1,2,3,4,5],m:.47,t:1200},{n:"18–39",lv:[1,2,3,4,5],m:.45,t:1200},{n:"40–59",lv:[1,2,3,4,5],m:.45,t:1500},{n:"60+",lv:[1,2,3,4,5],m:.42,t:1800}];

/* Numerical generator */
function numOpts(ans){const s=new Set([ans]);while(s.size<4){const v=ans+pk([-1,1])*R(1,6);if(v>0)s.add(v)}const o=sh([...s]);return{o:o.map(String),a:o.indexOf(ans)}}
function genNum(l,t){const A=t>0;let s,e,a,b,x,y;
const V=[[()=>{a=R(1,A?20:10);x=pk(A?[2,3,4,5,6,7,9]:[1,2,3,5,10]);s=[0,1,2,3,4,5].map(i=>a+i*x);e='Each number adds '+x+'.'},()=>{x=pk(A?[2,3,4,5]:[1,2,3]);a=R(5,9)*x+5*x;s=[0,1,2,3,4,5].map(i=>a-i*x);e='Each number goes down by '+x+'.'}],
[()=>{a=R(1,3);x=A?pk([2,3]):2;s=[0,1,2,3,4,5].map(i=>a*x**i);e='Each number is multiplied by '+x+'.'},()=>{a=R(10,30);x=R(2,A?9:4);y=R(1,x-1);s=[a];for(let i=0;i<5;i++)s.push(s[i]+(i%2?-y:x));e='The numbers go up '+x+', then down '+y+', repeating.'}],
[()=>{a=R(1,9);x=R(1,3);s=[a];for(let i=0;i<5;i++)s.push(s[i]+x+i);e='The gap grows by 1 each step (+'+x+', +'+(x+1)+', +'+(x+2)+' …).'},()=>{a=R(1,6);s=[0,1,2,3,4,5].map(i=>(a+i)**2);e='These are square numbers: '+a+'², '+(a+1)+'², '+(a+2)+'² …'}],
[()=>{a=R(2,9);b=R(30,60);x=R(2,5);y=R(2,6);s=[];for(let i=0;i<3;i++)s.push(a+i*x,b-i*y);e='Two series are interleaved: one adds '+x+', the other subtracts '+y+'.'},()=>{a=R(1,4);y=R(1,3);s=[a];for(let i=0;i<5;i++)s.push(s[i]*2+y);e='Each number is double the last, plus '+y+'.'}],
[()=>{a=R(1,4);b=R(2,5);s=[a,b];for(let i=2;i<6;i++)s.push(s[i-1]+s[i-2]);e='Each number is the sum of the two before it.'},()=>{a=R(1,5);s=[0,1,2,3,4,5].map(i=>(a+i)*(a+i+1));e='Each is two consecutive numbers multiplied: '+a+'×'+(a+1)+', '+(a+1)+'×'+(a+2)+' …'}]];
pk(A||l<3?V[l-1]:V[l-1].slice(0,1))();const o=numOpts(s[5]);return{d:0,l,q:'What number comes next?',v:s.slice(0,5).join(', ')+', <span class=qm>?</span>',o:o.o,a:o.a,e}}
function genNumOld(l){let t,e,a,b,d;
 if(l==1){a=R(1,20);d=R(2,9);t=[0,1,2,3,4,5].map(i=>a+i*d);e="Each number adds "+d+".";}
 else if(l==2){a=R(1,4);d=R(2,3);t=[0,1,2,3,4,5].map(i=>a*d**i);e="Each number is multiplied by "+d+".";}
 else if(l==3){a=R(1,9);d=R(1,3);t=[a];for(let i=0;i<5;i++)t.push(t[i]+d+i);e="The gap grows by 1 each step (+"+d+", +"+(d+1)+", +"+(d+2)+" …).";}
 else if(l==4){a=R(2,9);b=R(30,60);const x=R(2,5),y=R(2,6);t=[];for(let i=0;i<3;i++)t.push(a+i*x,b-i*y);e="Two series are interleaved: one adds "+x+", the other subtracts "+y+".";}
 else{a=R(1,4);b=R(2,5);t=[a,b];for(let i=2;i<6;i++)t.push(t[i-1]+t[i-2]);e="Each number is the sum of the two before it.";}
 const o=numOpts(t[5]);return{d:0,l,q:"What number comes next?",v:t.slice(0,5).join(", ")+", <span class=qm>?</span>",o:o.o,a:o.a,e}}
/* Pattern generator */
const cell=(a,n)=>{let c="";for(let i=0;i<n;i++)c+=`<circle cx="${40-(n-1)*8+i*16}" cy="68" r="4" fill="currentColor"/>`;return `<svg viewBox="0 0 80 80" width="56" height="56"><g transform="rotate(${a} 40 34)"><path d="M40 12v44M40 12l-10 12M40 12l10 12" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>${c}</svg>`};
